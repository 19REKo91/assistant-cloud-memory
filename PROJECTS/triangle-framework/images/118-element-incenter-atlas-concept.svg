<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
<defs><style>.h{font:700 30px sans-serif;fill:#172b4d}.s{font:18px sans-serif;fill:#42526e}.b{font:20px sans-serif;fill:#243b53}.p{fill:#fff;stroke:#d6dde5;stroke-width:2}.d{stroke:#6c7a89;stroke-width:3;stroke-dasharray:9 8;fill:none}</style></defs>
<rect width="1600" height="1000" fill="#f7f9fc"/>
<text x="800" y="58" text-anchor="middle" class="h">أطلس المثلثات الهندسية للعناصر الـ118</text>
<text x="800" y="92" text-anchor="middle" class="s">مخطط إعادة بناء الغرض — ليس خريطة نتائج هندسية معتمدة</text>
<rect x="55" y="125" width="1490" height="560" rx="22" class="p"/>
<text x="95" y="175" class="h">مثلث مستقل لكل عنصر، ومنصفات الزوايا تتلاقى في G</text>
<polygon points="390,570 800,235 1210,570" fill="#edf2f7" stroke="#334e68" stroke-width="5"/>
<circle cx="390" cy="570" r="12" fill="#239b56"/><circle cx="1210" cy="570" r="12" fill="#2874a6"/><circle cx="800" cy="235" r="12" fill="#d68910"/>
<text x="340" y="615" class="b">A — المادة</text><text x="1110" y="615" class="b">B — الزمكان</text><text x="800" y="205" text-anchor="middle" class="b">C — القانون</text>
<path d="M390 570 L800 424 M1210 570 L800 424 M800 235 L800 424" class="d"/>
<circle cx="800" cy="424" r="13" fill="#c0392b" stroke="#fff" stroke-width="4"/><text x="825" y="417" class="h">G</text><text x="825" y="449" class="s">مركز الدائرة الداخلية</text>
<rect x="1260" y="230" width="240" height="320" rx="16" fill="#f3f6f9" stroke="#d6dde5"/>
<text x="1380" y="275" text-anchor="middle" class="h">بيانات المشروع</text><text x="1380" y="345" text-anchor="middle" class="h">118</text><text x="1380" y="375" text-anchor="middle" class="s">عنصراً إجمالاً</text><text x="1380" y="440" text-anchor="middle" class="h">111</text><text x="1380" y="470" text-anchor="middle" class="s">مصنّفاً</text><text x="1380" y="515" text-anchor="middle" class="h">7 مستبعدة</text>
<text x="95" y="655" class="s">G في هذا الرسم توضيحي فقط؛ لا يمثل إحداثيات عنصر حقيقي.</text>
<rect x="55" y="720" width="1490" height="220" rx="22" class="p"/><text x="95" y="770" class="h">تسلسل التنفيذ</text>
<g fill="#f3f6f9" stroke="#d6dde5"><rect x="95" y="800" width="310" height="90" rx="12"/><rect x="465" y="800" width="310" height="90" rx="12"/><rect x="835" y="800" width="310" height="90" rx="12"/><rect x="1205" y="800" width="300" height="90" rx="12"/></g>
<g class="b" text-anchor="middle"><text x="250" y="838">1 — تثبيت بيانات العنصر</text><text x="620" y="838">2 — بناء المثلث</text><text x="990" y="838">3 — منصفات الزوايا و G</text><text x="1355" y="838">4 — لوحة 118 عنصراً</text></g>
<g class="s" text-anchor="middle"><text x="250" y="868">Z، الرمز، الزوايا، المصدر</text><text x="620" y="868">بعد حسم نوع الهندسة</text><text x="990" y="868">حساب واختبار مستقل</text><text x="1355" y="868">مقارنة وتكبير وفحص</text></g>
<text x="800" y="975" text-anchor="middle" class="s">تنبيه: هذا مخطط تصميمي، وليس نسخة مطابقة للصورة الأصلية المفقودة.</text></svg>