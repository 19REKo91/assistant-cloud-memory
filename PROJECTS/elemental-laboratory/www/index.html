<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<title>Elemental Laboratory</title>


<style>
:root{
  --bg:#0a0a14; --panel:#141420; --panel2:#1c1c2c;
  --border:#2a2a3e; --text:#e8e8f0; --muted:#8888a0;
  --fire:#ff6b35; --air:#a8d8ff; --water:#3b82f6; --earth:#84cc16;
  --ok:#22c55e; --err:#ef4444;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;
  overflow:hidden;user-select:none}
#app{display:flex;flex-direction:column;height:100dvh}

header{padding:10px 14px;text-align:center;border-bottom:1px solid var(--border);flex-shrink:0}
header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.5px}
header p{margin:2px 0 0;font-size:10px;color:var(--muted)}

#canvas-wrap{flex:1;min-height:180px;position:relative;background:radial-gradient(ellipse at center,#141428,#0a0a14)}
#scene{width:100%;height:100%;display:block;touch-action:none}

#tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--panel)}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:11px;cursor:pointer;
  border-bottom:2px solid transparent;color:var(--muted);transition:all .15s}
.tab.active{color:var(--text);border-bottom-color:currentColor}
.tab[data-face=ABC].active{color:var(--fire)}
.tab[data-face=ABD].active{color:var(--air)}
.tab[data-face=ACD].active{color:var(--water)}
.tab[data-face=BCD].active{color:var(--earth)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:4px;vertical-align:middle;background:var(--muted)}
.tab.ok .dot{background:var(--ok)} .tab.err .dot{background:var(--err)}

#panel{flex-shrink:0;padding:10px 12px;background:var(--panel);max-height:42dvh;overflow-y:auto}
#panel .row{display:flex;gap:6px;margin-bottom:6px}
#panel .row label{flex:0 0 44px;font-size:12px;color:var(--muted);align-self:center}
#panel .row input{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:8px 10px;border-radius:8px;font-size:14px;text-align:center;width:100%;min-width:0}
#panel .row input:focus{outline:none;border-color:currentColor}
#panel .row input.computed{color:var(--muted);font-style:italic;background:#101018}
#panel .row input.invalid{border-color:var(--err)}
#panel .row .unit{flex:0 0 16px;font-size:11px;color:var(--muted);align-self:center;text-align:center}
#panel h3{margin:6px 0 6px;font-size:12px;color:var(--muted);font-weight:500}
#status{margin-top:6px;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.5;display:none}
#status.show{display:block}
#status.ok{background:rgba(34,197,94,.1);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
#status.err{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.3)}

#actions{display:flex;gap:6px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--border);flex-shrink:0}
.btn{flex:1;padding:10px 6px;border-radius:8px;border:none;font-size:12px;font-weight:500;
  cursor:pointer;color:#fff;background:var(--panel2);border:1px solid var(--border);transition:all .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent}
.btn.build{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:transparent}
.btn:disabled{opacity:.4}

#info-page{position:fixed;inset:0;background:var(--bg);z-index:100;
  display:none;flex-direction:column;overflow-y:auto}
#info-page.open{display:flex}
#info-page header{position:sticky;top:0;background:var(--bg);z-index:2}
#info-page .body{padding:14px;flex:1}
#info-page .face-title{font-size:15px;font-weight:600;margin-bottom:10px}
#info-page .data-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
#info-page .data-cell{background:var(--panel);border:1px solid var(--border);padding:8px 10px;border-radius:8px;font-size:12px}
#info-page .data-cell .k{color:var(--muted);font-size:10px;margin-bottom:3px}
#info-page .sub-angles{margin-top:14px}
#info-page .sub-title{font-size:12px;color:var(--muted);margin-bottom:8px}
#info-page .sub-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);
  border-radius:10px;margin-bottom:6px;border:1px solid var(--border)}
#info-page .sub-swatch{width:20px;height:20px;border-radius:6px;flex-shrink:0}
#info-page .sub-label{flex:1;font-size:12px}
#info-page .sub-value{font-size:15px;font-weight:600}
#info-page .sub-total{margin-top:10px;padding:10px 12px;background:rgba(99,102,241,.15);
  border-radius:10px;font-size:12px;display:flex;justify-content:space-between}
#info-page .back-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;margin-bottom:10px}

#error-toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
  background:#7f1d1d;color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;
  z-index:50;display:none;max-width:90%;text-align:center}
#error-toast.show{display:block}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Elemental Laboratory</h1>
    <p>مختبر العناصر — الهرم الرباعي</p>
  </header>

  <div id="canvas-wrap">
    <canvas id="scene"></canvas>
  </div>

  <div id="tabs">
    <div class="tab active" data-face="ABC">ABC<span class="dot"></span></div>
    <div class="tab" data-face="ABD">ABD<span class="dot"></span></div>
    <div class="tab" data-face="ACD">ACD<span class="dot"></span></div>
    <div class="tab" data-face="BCD">BCD<span class="dot"></span></div>
  </div>

  <div id="panel"></div>

  <div id="actions">
    <button class="btn" id="btn-validate">تحقق</button>
    <button class="btn build" id="btn-build">ابنِ الهرم</button>
    <button class="btn" id="btn-info">معلومات</button>
    <button class="btn" id="btn-save">تصدير</button>
    <button class="btn" id="btn-load">استيراد</button>
    <input type="file" id="file-input" accept=".json" hidden>
  </div>
</div>

<div id="info-page">
  <header>
    <button class="back-btn" id="info-back">→ رجوع</button>
  </header>
  <div class="body" id="info-body"></div>
</div>

<div id="error-toast"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
