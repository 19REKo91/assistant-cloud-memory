name: Vision Bridge Android Build

on:
  push:
    paths:
      - "vision-bridge/android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision-bridge/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Run unit tests
        run: gradle --no-daemon test
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vision-bridge-debug-apk
          path: vision-bridge/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
