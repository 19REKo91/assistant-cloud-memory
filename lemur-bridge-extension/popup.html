<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lemur Command Bridge</title>
  <style>
    body{font:14px system-ui,sans-serif;min-width:290px;max-width:340px;padding:14px;color:#202124}
    h1{font-size:17px;margin:0 0 8px}p{line-height:1.45}button{padding:9px 12px;margin:4px 4px 4px 0;border:0;border-radius:7px;background:#303f9f;color:white}
    button.secondary{background:#5f6368}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f4;padding:8px;border-radius:7px;max-height:200px;overflow:auto}
    .note{font-size:12px;color:#5f6368}
  </style>
</head>
<body>
  <h1>Lemur Command Bridge</h1>
  <p id="status">Loading status…</p>
  <button id="start">Start listening</button>
  <button id="stop" class="secondary">Stop</button>
  <button id="check" class="secondary">Check now</button>
  <p class="note">Prototype only. It opens public test pages from a strict allowlist. It does not read page content or control logged-in sites.</p>
  <strong>Last result</strong>
  <pre id="result">No result yet.</pre>
  <script src="popup.js"></script>
</body>
</html>
