services:
  - type: web
    name: chrono-cross-reader-bridge
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: chrono-reader-core/Dockerfile
    dockerContext: chrono-reader-core
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CHRONO_READER_BRIDGE_TOKEN
        sync: false
