<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سجل المحادثات — assistant-cloud-memory</title>
<style>
:root{color-scheme:light dark}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:900px;margin:0 auto;padding:24px;line-height:1.7}h1{line-height:1.3}input{width:100%;box-sizing:border-box;padding:12px;font:inherit;border:1px solid #888;border-radius:8px;margin:12px 0}li{margin:8px 0;overflow-wrap:anywhere}a{color:#268bd2}.note{opacity:.8;font-size:.95rem}
</style>
</head>
<body>
<h1>سجل المحادثات</h1>
<p>فهرس للملفات النصية المحفوظة في المستودع <b>assistant-cloud-memory</b>. اختر ملفًا لقراءته، أو ابحث باسمه.</p>
<input id="q" type="search" placeholder="ابحث في أسماء الملفات…" aria-label="ابحث في أسماء الملفات">
<p id="status" class="note">جارٍ تحميل قائمة الملفات…</p>
<ul id="files"></ul>
<script>
const owner="19REKo91", repo="assistant-cloud-memory", branch="vision-bridge-onedrive-direct-test";
const list=document.getElementById("files"), status=document.getElementById("status"), query=document.getElementById("q");
let entries=[];
function render(){
 const q=query.value.trim().toLocaleLowerCase();
 list.replaceChildren();
 const matches=entries.filter(x=>x.name.toLocaleLowerCase().includes(q));
 for(const item of matches){
  const li=document.createElement("li"), a=document.createElement("a");
  a.href=item.html_url; a.textContent=item.name; a.target="_blank"; a.rel="noopener noreferrer";
  li.appendChild(a); list.appendChild(li);
 }
 status.textContent=matches.length+" ملفًا"+(q?" مطابقًا للبحث":" متاحًا")+".";
}
query.addEventListener("input",render);
fetch("https://api.github.com/repos/"+owner+"/"+repo+"/git/trees/"+branch+"?recursive=1")
.then(r=>{if(!r.ok)throw new Error("GitHub API: "+r.status);return r.json()})
.then(data=>{
 entries=(data.tree||[]).filter(x=>x.type==="blob"&&/\.(md|txt|html|pdf)$/i.test(x.path))
 .map(x=>({name:x.path,html_url:"https://github.com/"+owner+"/"+repo+"/blob/"+branch+"/"+x.path.split("/").map(encodeURIComponent).join("/")}))
 .sort((a,b)=>a.name.localeCompare(b.name,"ar"));
 render();
})
.catch(e=>{status.textContent="تعذّر تحميل الفهرس تلقائيًا. افتح المستودع مباشرة: https://github.com/"+owner+"/"+repo;});
</script>
</body>
</html>
