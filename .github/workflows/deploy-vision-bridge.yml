name: Deploy vision bridge

on:
  push:
    branches: ["main"]
    paths:
      - "vision-bridge/**"
      - ".github/workflows/deploy-vision-bridge.yml"
  pull_request:
    paths:
      - "vision-bridge/**"
      - ".github/workflows/deploy-vision-bridge.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vision-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy --name chatgpt-vision-bridge

      - name: End-to-end remote image vision test
        working-directory: .
        env:
          IMAGE_URL: "https://1drv.ms/i/c/083c9002e9811882/IQA7YAJnTm02RokOcX1Z4uQAARIRWzP_xIg0fgasxyWF2ew"
          BRIDGE_URL: "https://chatgpt-vision-bridge.flourish-gerbil.workers.dev/vision"
        run: |
          set -euo pipefail
          set +e
          RESPONSE="$(curl -sS --retry 2 --retry-delay 2 -G "${BRIDGE_URL}" \
            --data-urlencode "image_url=${IMAGE_URL}" \
            --data-urlencode 'prompt=Describe exactly what is visible in this image. Return concise text only.')"
          CURL_STATUS=$?
          set -e
          echo "Bridge HTTP/curl status: ${CURL_STATUS}"
          echo "Bridge response:"
          echo "${RESPONSE}"
          if [ "${CURL_STATUS}" -ne 0 ]; then
            exit "${CURL_STATUS}"
          fi
          node -e '
            const r = JSON.parse(process.argv[1]);
            if (r.ok !== true || typeof r.text !== "string" || !r.text.trim()) {
              console.error("Remote vision test failed:", r);
              process.exit(1);
            }
            console.log("REMOTE_VISION_TEST_OK");
            console.log("TEXT_ONLY_LENGTH=" + r.text.trim().length);
          ' "${RESPONSE}"
