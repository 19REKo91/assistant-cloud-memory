name: Deploy vision bridge (temporary)

on:
  push:
    branches: ["main"]
    paths:
      - "vision-bridge/**"
      - ".github/workflows/deploy-vision-bridge.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vision-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy temporary Worker
        shell: bash
        run: |
          set -o pipefail
          npx wrangler@latest deploy --temporary --name chatgpt-vision-bridge 2>&1 |
            sed -E 's#https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+#CLAIM_URL_REDACTED#g' |
            tee deploy-output.txt
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Vision Bridge deployment URL" >> "$GITHUB_STEP_SUMMARY"
          grep -Eo 'https://[^[:space:]]+workers\.dev' deploy-output.txt | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
