name: Atomic Interior Relationship Search

on:
  workflow_dispatch:
  push:
    paths:
      - 'PROJECTS/triangle-framework/6.5.0/research/atomic-interior/**'
      - 'PROJECTS/triangle-framework/6.5.0/elements_input_118.csv'
      - '.github/workflows/atomic-interior-search.yml'

concurrency:
  group: atomic-interior-relationship-search
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  atomic-interior-search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'PROJECTS/triangle-framework/6.5.0/research/atomic-interior/requirements.txt'

      - name: Install research dependencies
        run: python -m pip install -r PROJECTS/triangle-framework/6.5.0/research/atomic-interior/requirements.txt

      - name: Run parser and calculation tests
        working-directory: PROJECTS/triangle-framework/6.5.0/research/atomic-interior
        run: python -m unittest -v test_search.py test_electronic_and_stable.py test_levels_search.py

      - name: Run AME2020 nuclear relationship search
        run: >-
          python PROJECTS/triangle-framework/6.5.0/research/atomic-interior/search.py
          --framework PROJECTS/triangle-framework/6.5.0/elements_input_118.csv
          --out atomic-interior-results

      - name: Run NUBASE2020 stable isotope analysis
        run: >-
          python PROJECTS/triangle-framework/6.5.0/research/atomic-interior/stable_isotope_search.py
          --framework PROJECTS/triangle-framework/6.5.0/elements_input_118.csv
          --ame-nuclides atomic-interior-results/AME2020_nuclide_separation_energies.csv
          --out atomic-interior-results

      - name: Run NIST ASD electronic relationship search
        run: >-
          python PROJECTS/triangle-framework/6.5.0/research/atomic-interior/electronic_search.py
          --framework PROJECTS/triangle-framework/6.5.0/elements_input_118.csv
          --out atomic-interior-results

      - name: Run NIST ASD neutral excitation-level search
        run: >-
          python PROJECTS/triangle-framework/6.5.0/research/atomic-interior/levels_search.py
          --framework PROJECTS/triangle-framework/6.5.0/elements_input_118.csv
          --out atomic-interior-results

      - name: Upload all research results
        uses: actions/upload-artifact@v4
        with:
          name: atomic-interior-results
          path: atomic-interior-results/*.csv
          if-no-files-found: error
          retention-days: 30
