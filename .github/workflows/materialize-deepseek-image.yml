name: materialize-deepseek-image
on:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode image
        run: |
          mkdir -p out
          base64 -d tmp/deepseek_20260919_88c59e.b64 > out/deepseek_20260919_88c59e.png
          file out/deepseek_20260919_88c59e.png
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-image-materialized
          path: out/deepseek_20260919_88c59e.png
