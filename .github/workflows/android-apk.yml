name: Build Elemental Laboratory APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PROJECTS/elemental-laboratory/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PROJECTS/elemental-laboratory
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # "tools" is a retired SDK package and causes sdkmanager to fail.
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - name: Install dependencies
        run: npm install
      - name: Bundle web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elemental-laboratory-debug-apk
          path: PROJECTS/elemental-laboratory/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
