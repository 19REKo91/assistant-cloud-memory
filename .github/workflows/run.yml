name: Run Prism Engine 6.3.0-beta

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependency
        run: python -m pip install --upgrade pip pandas
      - name: Run Prism Engine 6.3.0-beta
        run: |
          mkdir -p output
          set -o pipefail
          python PROJECTS/prism-engine/6.3.0-beta/main.py 2>&1 | tee output/full.log
      - name: Upload CSV and full log
        uses: actions/upload-artifact@v4
        with:
          name: prism-engine-6.3.0-beta-results
          path: |
            output/element-table-6.3.0-beta.csv
            output/full.log
          if-no-files-found: error
