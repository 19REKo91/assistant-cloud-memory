name: Inventory Triangle Source Archive

on:
  push:
    branches:
      - work/triangle-geometry-role-map-v0.1
    paths:
      - .github/workflows/inventory-triangle-source-archive.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Build safe ZIP inventory (no extraction)
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import csv
          import stat

          archive = Path("ARCHIVES/TAKKA_W_NOSS/طكة ونص/Triangle.zip")
          out_dir = Path("ARCHIVES/TAKKA_W_NOSS/triangle-zip-inventory")
          out_dir.mkdir(parents=True, exist_ok=True)
          if not archive.is_file():
              raise SystemExit(f"Archive not found: {archive}")

          text_ext = {".md", ".txt", ".csv", ".json", ".py", ".yml", ".yaml", ".xml", ".svg", ".html", ".kt", ".java"}
          rows = []
          ext_counts = Counter()
          total_uncompressed = 0
          unsafe = []
          with ZipFile(archive) as zf:
              infos = zf.infolist()
              for i, info in enumerate(infos, 1):
                  name = info.filename.replace("\\", "/")
                  member = PurePosixPath(name)
                  mode = info.external_attr >> 16
                  is_symlink = stat.S_ISLNK(mode)
                  safe = not member.is_absolute() and ".." not in member.parts and bool(member.parts) and not is_symlink
                  if not safe:
                      unsafe.append(name)
                  ext = Path(name).suffix.lower() or "[no extension]"
                  ext_counts[ext] += 1
                  total_uncompressed += info.file_size
                  rows.append({
                      "index": i,
                      "path": name,
                      "file_size": info.file_size,
                      "compressed_size": info.compress_size,
                      "crc32": f"{info.CRC:08x}",
                      "is_directory": info.is_dir(),
                      "is_symlink": is_symlink,
                      "safe_path": safe,
                      "text_candidate": ext in text_ext,
                      "extension": ext,
                  })

          csv_path = out_dir / "Triangle.zip.inventory.csv"
          with csv_path.open("w", encoding="utf-8-sig", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=list(rows[0]) if rows else [
                  "index","path","file_size","compressed_size","crc32","is_directory","is_symlink","safe_path","text_candidate","extension"
              ])
              writer.writeheader()
              writer.writerows(rows)

          relevant = [r for r in rows if any(k in r["path"].lower() for k in ("triangle","element","118","prism","angle","mass","density","geometry","rule60"))]
          lines = [
              "# Triangle.zip — Safe Archive Inventory",
              "",
              f"- Archive bytes: {archive.stat().st_size}",
              f"- Entries: {len(rows)}",
              f"- Total uncompressed bytes: {total_uncompressed}",
              f"- Unsafe entries: {len(unsafe)}",
              f"- Text-like entries: {sum(r['text_candidate'] for r in rows)}",
              "",
              "## Entries by extension",
              "",
          ]
          for ext, count in sorted(ext_counts.items(), key=lambda x: (-x[1], x[0])):
              lines.append(f"- {ext}: {count}")
          lines += ["", "## Triangle/framework-related path candidates", ""]
          for r in relevant[:300]:
              lines.append(f"- `{r['path']}` ({r['file_size']} bytes; text_candidate={r['text_candidate']}; safe={r['safe_path']})")
          if unsafe:
              lines += ["", "## Unsafe entries (not extracted)", ""]
              lines.extend(f"- `{x}`" for x in unsafe)
          (out_dir / "Triangle.zip.inventory.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Inventory entries: {len(rows)}")
          print(f"Text candidates: {sum(r['text_candidate'] for r in rows)}")
          print(f"Unsafe entries: {len(unsafe)}")
          print(f"Inventory: {out_dir}")

      - name: Commit inventory only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCHIVES/TAKKA_W_NOSS/triangle-zip-inventory
          if git diff --cached --quiet; then
            echo "Inventory unchanged."
            exit 0
          fi
          git commit -m "Add safe inventory of Triangle source archive"
          git push
