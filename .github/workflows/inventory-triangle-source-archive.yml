name: Inventory and Preview Triangle Source Archive

on:
  workflow_dispatch:
  push:
    branches:
      - work/triangle-geometry-role-map-v0.1
    paths:
      - .github/workflows/inventory-triangle-source-archive.yml

permissions:
  contents: write

jobs:
  inspect-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Build safe inventory, extract source text, and render image contact sheets
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from collections import Counter, defaultdict
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          import csv
          import io
          import stat

          archive = Path("ARCHIVES/TAKKA_W_NOSS/طكة ونص/Triangle.zip")
          out_dir = Path("ARCHIVES/TAKKA_W_NOSS/triangle-zip-inventory")
          out_dir.mkdir(parents=True, exist_ok=True)
          if not archive.is_file():
              raise SystemExit(f"Archive not found: {archive}")

          rows = []
          ext_counts = Counter()
          total_uncompressed = 0
          unsafe = []
          png_groups = defaultdict(list)
          source_text = None
          with ZipFile(archive) as zf:
              infos = zf.infolist()
              for i, info in enumerate(infos, 1):
                  name = info.filename.replace("\\", "/")
                  member = PurePosixPath(name)
                  mode = info.external_attr >> 16
                  is_symlink = stat.S_ISLNK(mode)
                  safe = not member.is_absolute() and ".." not in member.parts and bool(member.parts) and not is_symlink
                  if not safe:
                      unsafe.append(name)
                  ext = Path(name).suffix.lower() or "[no extension]"
                  ext_counts[ext] += 1
                  total_uncompressed += info.file_size
                  rows.append({
                      "index": i, "path": name, "file_size": info.file_size,
                      "compressed_size": info.compress_size, "crc32": f"{info.CRC:08x}",
                      "is_directory": info.is_dir(), "is_symlink": is_symlink,
                      "safe_path": safe, "extension": ext,
                  })
                  if not safe or info.is_dir():
                      continue
                  if name == "Triangle/T.py":
                      source_text = zf.read(info).decode("utf-8", errors="replace")
                  if ext == ".png":
                      if "/Valid_Triangles/" in name:
                          group = "valid"
                      elif "/Invalid_Triangles/" in name:
                          group = "invalid"
                      elif "/Analysis_Charts/" in name:
                          group = "charts"
                      else:
                          group = "other"
                      png_groups[group].append((name, zf.read(info)))

          if unsafe:
              raise SystemExit("Unsafe archive paths detected; no source or image preview was generated.")

          with (out_dir / "Triangle.zip.inventory.csv").open("w", encoding="utf-8-sig", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=list(rows[0]) if rows else [])
              writer.writeheader()
              writer.writerows(rows)

          if source_text is not None:
              (out_dir / "Triangle.zip.T.py.source.txt").write_text(source_text, encoding="utf-8")
          else:
              raise SystemExit("Expected Triangle/T.py source file was not found.")

          def make_sheet(group, items):
              if not items:
                  return
              cell_w, cell_h, thumb_w, thumb_h = 180, 154, 164, 118
              cols = 6 if group == "valid" else 3
              rows_n = (len(items) + cols - 1) // cols
              sheet = Image.new("RGB", (cols * cell_w, rows_n * cell_h), "white")
              draw = ImageDraw.Draw(sheet)
              try:
                  font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 13)
              except OSError:
                  font = ImageFont.load_default()
              for idx, (name, raw) in enumerate(items):
                  image = Image.open(io.BytesIO(raw)).convert("RGBA")
                  bg = Image.new("RGBA", image.size, "white")
                  bg.alpha_composite(image)
                  thumb = ImageOps.contain(bg.convert("RGB"), (thumb_w, thumb_h))
                  x = (idx % cols) * cell_w
                  y = (idx // cols) * cell_h
                  px = x + (cell_w - thumb.width) // 2
                  py = y + 3
                  sheet.paste(thumb, (px, py))
                  label = PurePosixPath(name).name
                  draw.text((x + 5, y + 126), label, fill="black", font=font)
              sheet.save(out_dir / f"Triangle.zip.{group}-contact-sheet.png", optimize=True)

          for group in ("valid", "invalid", "charts", "other"):
              make_sheet(group, png_groups[group])

          lines = [
              "# Triangle.zip — Inventory and Visual Review Pack", "",
              f"- Archive bytes: {archive.stat().st_size}",
              f"- Entries: {len(rows)}",
              f"- Total uncompressed bytes: {total_uncompressed}",
              f"- Unsafe entries: {len(unsafe)}",
              f"- PNG files: {sum(len(v) for v in png_groups.values())}",
              f"- Triangle/T.py source bytes: {len(source_text.encode('utf-8')) if source_text is not None else 0}",
              "", "## Entries by extension", ""
          ]
          for ext, count in sorted(ext_counts.items(), key=lambda x: (-x[1], x[0])):
              lines.append(f"- {ext}: {count}")
          lines += ["", "## PNG groups", ""]
          for group in ("valid", "invalid", "charts", "other"):
              lines.append(f"- {group}: {len(png_groups[group])}")
          lines += [
              "", "## Generated review files", "",
              "- `Triangle.zip.T.py.source.txt`: source text copied for reading only; never executed.",
              "- `Triangle.zip.valid-contact-sheet.png`: visual overview of valid triangle renders.",
              "- `Triangle.zip.invalid-contact-sheet.png`: visual overview of invalid triangle renders.",
              "- `Triangle.zip.charts-contact-sheet.png`: visual overview of analysis charts.",
              "", "The original ZIP is unchanged. Images are read in memory to make contact sheets; no archive code is executed."
          ]
          (out_dir / "Triangle.zip.review-pack.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Inventory entries: {len(rows)}")
          print(f"PNG groups: { {k: len(v) for k, v in png_groups.items()} }")
          print(f"Source text bytes: {len(source_text.encode('utf-8'))}")
          print(f"Review pack: {out_dir}")
          PY

      - name: Commit review pack only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCHIVES/TAKKA_W_NOSS/triangle-zip-inventory
          if git diff --cached --quiet; then
            echo "Review pack unchanged."
            exit 0
          fi
          git commit -m "Add visual review pack for Triangle source archive"
          git push
