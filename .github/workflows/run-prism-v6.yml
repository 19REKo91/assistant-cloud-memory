name: Run Prism Engine v6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-v6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile and run Prism Engine v6
        working-directory: PROJECTS/prism-engine/v6
        run: |
          python -m py_compile main.py
          python main.py

      - name: Upload v6 outputs
        uses: actions/upload-artifact@v4
        with:
          name: prism-v6-truth-first-outputs
          path: |
            PROJECTS/prism-engine/v6/outputs/v6_elements_118_plus_extensions.csv
            PROJECTS/prism-engine/v6/outputs/v6_mass_predictions_119_126.csv
            PROJECTS/prism-engine/v6/outputs/v6_run_audit.json
          if-no-files-found: error
