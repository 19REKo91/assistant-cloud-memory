name: github-to-dropbox-vision-bridge

on:
  push:
    branches: ["main"]
    paths:
      - "deepseek_20260919_88c59e.png"
      - ".github/workflows/github-to-dropbox-vision-bridge.yml"
  workflow_dispatch:

jobs:
  upload-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate source image
        run: |
          set -euo pipefail
          test -f deepseek_20260919_88c59e.png
          file deepseek_20260919_88c59e.png
          sha256sum deepseek_20260919_88c59e.png

      - name: Exchange refresh token for access token
        id: dropbox-token
        env:
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
        run: |
          set -euo pipefail
          test -n "$DROPBOX_REFRESH_TOKEN"
          test -n "$DROPBOX_APP_KEY"
          test -n "$DROPBOX_APP_SECRET"

          HTTP_STATUS=$(curl --silent --show-error \
            --request POST \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "refresh_token=$DROPBOX_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "client_id=$DROPBOX_APP_KEY" \
            --data-urlencode "client_secret=$DROPBOX_APP_SECRET" \
            --output /tmp/token.json \
            --write-out "%{http_code}" \
            https://api.dropboxapi.com/oauth2/token)

          echo "Dropbox OAuth refresh HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          body = Path("/tmp/token.json").read_text(encoding="utf-8", errors="replace").strip()
          try:
              data = json.loads(body)
              print("Dropbox OAuth error:", data.get("error", "unknown"))
              print("Description:", data.get("error_description", "not provided"))
          except Exception:
              print("Dropbox returned a non-JSON error response.")
              print(body[:500])
          PY
            exit 1
          fi

          python - <<'PY'
          import json
          data = json.load(open("/tmp/token.json"))
          token = data.get("access_token")
          if not token:
              raise SystemExit("No access_token returned by Dropbox")
          print("Fresh Dropbox access token received.")
          with open("/tmp/access_token", "w", encoding="utf-8") as f:
              f.write(token)
          PY

          TOKEN=$(cat /tmp/access_token)
          echo "::add-mask::$TOKEN"
          echo "access_token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload exact source image to Dropbox
        env:
          DROPBOX_ACCESS_TOKEN: ${{ steps.dropbox-token.outputs.access_token }}
        run: |
          set -euo pipefail
          API_ARG='{"path":"/deepseek_20260919_88c59e.png","mode":"overwrite","autorename":false,"mute":true}'
          HTTP_STATUS=$(curl --silent --show-error \
            --output /tmp/dropbox-upload.json \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $DROPBOX_ACCESS_TOKEN" \
            --header "Content-Type: application/octet-stream" \
            --header "Dropbox-API-Arg: $API_ARG" \
            --data-binary @deepseek_20260919_88c59e.png \
            https://content.dropboxapi.com/2/files/upload)
          echo "Dropbox upload HTTP status: $HTTP_STATUS"
          cat /tmp/dropbox-upload.json
          test "$HTTP_STATUS" = "200"

      - name: Verify Dropbox upload
        env:
          DROPBOX_ACCESS_TOKEN: ${{ steps.dropbox-token.outputs.access_token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $DROPBOX_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"path":"/deepseek_20260919_88c59e.png"}' \
            https://api.dropboxapi.com/2/files/get_metadata \
            > /tmp/dropbox-metadata.json

          python - <<'PY'
          import json
          from pathlib import Path
          local_size = Path("deepseek_20260919_88c59e.png").stat().st_size
          meta = json.load(open("/tmp/dropbox-metadata.json"))
          remote_size = meta["size"]
          assert local_size == remote_size, (local_size, remote_size)
          print(f"Verified Dropbox size: {remote_size} bytes")
          print(f"Dropbox path: {meta.get('path_display', meta.get('path_lower', 'unknown'))}")
          print(f"Dropbox content hash: {meta.get('content_hash', 'n/a')}")
          PY
