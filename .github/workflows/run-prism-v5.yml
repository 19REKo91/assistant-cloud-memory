name: Run Prism Engine v5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-v5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run The Eye of the Prism v5
        working-directory: PROJECTS/prism-engine/v5
        run: python main.py

      - name: Upload v5 CSV
        uses: actions/upload-artifact@v4
        with:
          name: prism-v5-elements-118
          path: PROJECTS/prism-engine/v5/outputs/v5_elements_118.csv
          if-no-files-found: error
