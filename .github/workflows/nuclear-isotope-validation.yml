name: Nuclear Isotope Validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r PROJECTS/nuclear-isotope-audit/requirements.txt
      - name: Run independent validation
        working-directory: PROJECTS/nuclear-isotope-audit
        run: python validate.py
      - name: Upload validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclear-isotope-validation-outputs
          path: PROJECTS/nuclear-isotope-audit/outputs/
          if-no-files-found: warn
          retention-days: 30
      - name: Archive validation outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECTS/nuclear-isotope-audit/outputs/
          if git diff --cached --quiet; then
            echo "No validation output changes to archive."
          else
            git commit -m "Archive independent isotope validation"
            git push
          fi
