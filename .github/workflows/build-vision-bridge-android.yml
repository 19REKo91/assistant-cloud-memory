name: Build Vision Bridge Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'vision-bridge-android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: vision-bridge-android
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vision-bridge-debug-apk
          path: vision-bridge-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
