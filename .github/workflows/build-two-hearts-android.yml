name: Build Two Hearts Android

on:
  workflow_dispatch:
  push:
    paths:
      - "two-hearts-android/**"
      - ".github/workflows/build-two-hearts-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android 35 SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore LINK debug signing key
        id: link-key-cache
        uses: actions/cache/restore@v4
        with:
          path: two-hearts-android/link-debug.keystore
          key: link-debug-signing-key-v1
      - name: Create LINK debug signing key if cache misses
        if: steps.link-key-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore two-hearts-android/link-debug.keystore \
            -storepass android -keypass android -alias linkdebug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LINK Prototype Debug, OU=Engineering, O=Raeeq, L=Baghdad, ST=Baghdad, C=IQ"
      - name: Save LINK debug signing key
        if: steps.link-key-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: two-hearts-android/link-debug.keystore
          key: link-debug-signing-key-v1
      - name: Run unit tests and assemble APK
        working-directory: two-hearts-android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: link-debug-apk
          path: two-hearts-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
