name: verify-image-bridge
on:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Decode PNG
        run: |
          mkdir -p out
          base64 -d tmp/verify_image.b64 > out/verified.png
          file out/verified.png
      - uses: actions/upload-artifact@v4
        with:
          name: verified-deepseek-image
          path: out/verified.png
