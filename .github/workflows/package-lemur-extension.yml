name: Package Lemur Command Bridge Extension

on:
  push:
    branches: ["lemur-browser-command-poc"]
    paths:
      - "lemur-bridge-extension/**"
      - ".github/workflows/package-lemur-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Package CRX3 and fallback ZIP
        run: |
          set -euo pipefail
          mkdir -p dist
          echo "Prototype policy: each fresh build may have a new extension ID; remove the previous prototype before installing this CRX."
          npx --yes crx3@2.0.0 ./lemur-bridge-extension \
            --crxPath ./dist/lemur-command-bridge.crx \
            --zipPath ./dist/lemur-command-bridge.zip \
            --keyPath ./dist/lemur-command-bridge.pem
          test -s ./dist/lemur-command-bridge.crx
          test -s ./dist/lemur-command-bridge.zip
          # The private signing key must never be included in the downloadable artifact.
          rm -f ./dist/lemur-command-bridge.pem
      - name: Publish CRX file on the isolated branch for phone download
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/lemur-command-bridge.crx
          if git diff --cached --quiet; then
            echo "CRX unchanged; no branch commit needed."
          else
            git commit -m "Build standalone Lemur prototype CRX"
            # Rebase in case a source commit landed after this run checked out the branch.
            git fetch origin lemur-browser-command-poc
            git rebase origin/lemur-browser-command-poc
            git push origin HEAD:lemur-browser-command-poc
          fi
      - name: Upload install artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lemur-command-bridge-install
          path: |
            dist/lemur-command-bridge.crx
            dist/lemur-command-bridge.zip
          if-no-files-found: error
          retention-days: 14
