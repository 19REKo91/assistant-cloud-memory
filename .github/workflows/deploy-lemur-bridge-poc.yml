name: Deploy isolated Lemur Bridge POC

on:
  push:
    branches: ["lemur-browser-command-poc"]
    paths:
      - "lemur-bridge-worker/**"
      - ".github/workflows/deploy-lemur-bridge-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lemur-bridge-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy separate Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify isolated Worker health endpoint
        working-directory: .
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS --max-time 8 https://lemur-browser-bridge-poc.flourish-gerbil.workers.dev/health -o "$RUNNER_TEMP/lemur-health.json"; then
              break
            fi
            sleep 3
          done
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/lemur-health.json", "utf8"));
            if (r.ok !== true || r.service !== "lemur-browser-bridge-poc") process.exit(1);
            console.log("LEMUR_BRIDGE_HEALTH_OK", JSON.stringify(r));
          '
