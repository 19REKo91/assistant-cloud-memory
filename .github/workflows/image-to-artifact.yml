name: image-to-artifact

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.webp"
      - ".github/workflows/image-to-artifact.yml"
  workflow_dispatch:
    inputs:
      image_path:
        description: "Optional image path. Leave empty to use the most recently committed image."
        required: false
        type: string

jobs:
  upload-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select image files
        id: select
        env:
          INPUT_IMAGE_PATH: ${{ inputs.image_path }}
        run: |
          set -euo pipefail
          rm -rf /tmp/images
          mkdir -p /tmp/images

          if [ -n "$INPUT_IMAGE_PATH" ]; then
            test -f "$INPUT_IMAGE_PATH"
            case "$INPUT_IMAGE_PATH" in
              *.png|*.jpg|*.jpeg|*.webp) ;;
              *) echo "Unsupported image type: $INPUT_IMAGE_PATH"; exit 1 ;;
            esac
            cp -- "$INPUT_IMAGE_PATH" /tmp/images/
          else
            image="$(
              git ls-files -- '*.png' '*.jpg' '*.jpeg' '*.webp' |
              while IFS= read -r f; do
                printf '%s\t%s\n' "$(git log -1 --format=%ct -- "$f")" "$f"
              done |
              sort -nr |
              head -n 1 |
              cut -f2-
            )"

            if [ -z "$image" ]; then
              echo "No image file exists in the repository."
              exit 1
            fi

            echo "Selected latest image: $image"
            cp -- "$image" /tmp/images/
          fi

          echo "Selected image files:"
          find /tmp/images -maxdepth 1 -type f -printf '%f\n'

      - name: Validate images
        run: |
          set -euo pipefail
          for image in /tmp/images/*; do
            file "$image"
            sha256sum "$image"
            stat -c 'Size: %s bytes' "$image"
          done

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-latest
          path: /tmp/images/*
          if-no-files-found: error
          retention-days: 7
