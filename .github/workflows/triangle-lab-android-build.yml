name: Triangle Lab Android build

on:
  push:
    paths:
      - "triangle-lab/**"
      - ".github/workflows/triangle-lab-android-build.yml"
  pull_request:
    paths:
      - "triangle-lab/**"
      - ".github/workflows/triangle-lab-android-build.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: triangle-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: triangle-lab-debug-apk
          path: triangle-lab/app/build/outputs/apk/debug/app-debug.apk
