name: Check Triangle Framework Continuity

on:
  workflow_dispatch:
  push:
    branches:
      - work/triangle-geometry-role-map-v0.1
    paths:
      - PROJECTS/triangle-framework/**
      - .github/workflows/check-triangle-continuity.yml

permissions:
  contents: read

jobs:
  continuity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate complete source register and content fingerprints
        run: python PROJECTS/triangle-framework/continuity/check_continuity.py --require-full
