name: dropbox-get-refresh-token

on:
  workflow_dispatch:

jobs:
  exchange-code:
    runs-on: ubuntu-latest

    steps:
      - name: Exchange Dropbox authorization code
        env:
          DROPBOX_AUTH_CODE: ${{ secrets.DROPBOX_AUTH_CODE }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
        run: |
          set -euo pipefail

          test -n "$DROPBOX_AUTH_CODE"
          test -n "$DROPBOX_APP_KEY"
          test -n "$DROPBOX_APP_SECRET"

          HTTP_STATUS=$(curl --silent --show-error             --request POST             --header "Content-Type: application/x-www-form-urlencoded"             --data-urlencode "code=$DROPBOX_AUTH_CODE"             --data-urlencode "grant_type=authorization_code"             --data-urlencode "client_id=$DROPBOX_APP_KEY"             --data-urlencode "client_secret=$DROPBOX_APP_SECRET"             --output /tmp/token.json             --write-out "%{http_code}"             https://api.dropboxapi.com/oauth2/token)

          echo "Dropbox OAuth HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          body = Path("/tmp/token.json").read_text(encoding="utf-8", errors="replace").strip()

          try:
              data = json.loads(body)
              print("Dropbox error:")
              print("error:", data.get("error", "unknown"))
              print("error_description:", data.get("error_description", "not provided"))
          except Exception:
              print("Dropbox returned a non-JSON error response.")
              print("Response:", body[:500])
          PY
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.load(open("/tmp/token.json"))

          refresh = data.get("refresh_token")
          if not refresh:
              raise SystemExit("No refresh_token returned by Dropbox")

          Path("/tmp/dropbox-refresh-token.txt").write_text(
              refresh + "\n",
              encoding="utf-8"
          )

          print("Refresh token generated successfully.")
          PY

      - name: Upload refresh token as temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropbox-refresh-token
          path: /tmp/dropbox-refresh-token.txt
          retention-days: 1
