name: Run Prism Engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run 6.5.0 constitutional audit
        run: python PROJECTS/triangle-framework/6.5.0/audit_6_5_0.py
      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triangle-framework-6.5.0-audit
          path: PROJECTS/triangle-framework/6.5.0/output/
          if-no-files-found: warn
