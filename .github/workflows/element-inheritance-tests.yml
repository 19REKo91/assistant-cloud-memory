name: Element Inheritance Tests (Box Loss and Nuclear Defect)

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Which independent test to run"
        required: true
        type: choice
        options:
          - box-only
          - all
        default: box-only

permissions:
  contents: write

jobs:
  element-inheritance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: PROJECTS/nuclear-isotope-audit/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r PROJECTS/nuclear-isotope-audit/requirements.txt
      - name: Rebuild isotope source tables
        if: inputs.test_scope == 'all'
        working-directory: PROJECTS/nuclear-isotope-audit
        run: python main.py
      - name: Run separate cumulative inheritance tests
        working-directory: PROJECTS/nuclear-isotope-audit
        run: |
          if [ "${{ inputs.test_scope }}" = "box-only" ]; then
            python element_inheritance_tests.py --box-only
          else
            python element_inheritance_tests.py
          fi
      - name: Upload inheritance outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: element-inheritance-tests
          path: |
            PROJECTS/nuclear-isotope-audit/outputs/element_inheritance_*
            PROJECTS/nuclear-isotope-audit/outputs/report_ar_element_inheritance.md
          if-no-files-found: warn
          retention-days: 30
      - name: Archive inheritance outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECTS/nuclear-isotope-audit/outputs/element_inheritance_* PROJECTS/nuclear-isotope-audit/outputs/report_ar_element_inheritance.md
          if git diff --cached --quiet; then
            echo "No inheritance output changes to archive."
          else
            git commit -m "Archive cumulative element inheritance test outputs"
            git push
          fi
