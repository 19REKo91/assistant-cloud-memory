name: Nuclear Isotope Audit and Cumulative Validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: PROJECTS/nuclear-isotope-audit/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r PROJECTS/nuclear-isotope-audit/requirements.txt

      - name: Run isotope audit
        working-directory: PROJECTS/nuclear-isotope-audit
        run: python main.py

      - name: Run independent validation, including cumulative checks
        working-directory: PROJECTS/nuclear-isotope-audit
        run: python validate.py

      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclear-isotope-audit-outputs
          path: |
            PROJECTS/nuclear-isotope-audit/outputs/
            PROJECTS/nuclear-isotope-audit/data/raw/
          if-no-files-found: warn
          retention-days: 30

      - name: Archive outputs and source data in repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECTS/nuclear-isotope-audit/outputs/ PROJECTS/nuclear-isotope-audit/data/raw/
          if git diff --cached --quiet; then
            echo "No output changes to archive."
          else
            git commit -m "Archive nuclear isotope audit outputs"
            git push
          fi
