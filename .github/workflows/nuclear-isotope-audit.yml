name: Nuclear Isotope Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: PROJECTS/nuclear-isotope-audit/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r PROJECTS/nuclear-isotope-audit/requirements.txt

      - name: Run isotope audit
        working-directory: PROJECTS/nuclear-isotope-audit
        run: python main.py

      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclear-isotope-audit-outputs
          path: |
            PROJECTS/nuclear-isotope-audit/outputs/
            PROJECTS/nuclear-isotope-audit/data/raw/
          if-no-files-found: warn
          retention-days: 30
