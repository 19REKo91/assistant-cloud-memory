name: Extract Takka W Noss Archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract archive safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import stat

          archive = Path("طكة ونص.zip")
          destination = Path("ARCHIVES/TAKKA_W_NOSS")
          if not archive.is_file():
              raise SystemExit(f"Archive not found: {archive}")
          if destination.exists():
              raise SystemExit(f"Destination already exists; refusing to overwrite: {destination}")

          destination.mkdir(parents=True)
          max_files = 10000
          max_uncompressed = 1024 * 1024 * 1024
          total_size = 0
          extracted = 0

          with ZipFile(archive) as zf:
              entries = zf.infolist()
              if len(entries) > max_files:
                  raise SystemExit(f"Archive has too many entries: {len(entries)}")
              for info in entries:
                  name = info.filename.replace("\\", "/")
                  member = PurePosixPath(name)
                  mode = info.external_attr >> 16
                  if member.is_absolute() or ".." in member.parts:
                      raise SystemExit(f"Unsafe path in ZIP: {info.filename}")
                  if not member.parts or member.parts[0] in ("", "."):
                      raise SystemExit(f"Invalid path in ZIP: {info.filename}")
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlinks are not allowed: {info.filename}")
                  total_size += info.file_size
                  if total_size > max_uncompressed:
                      raise SystemExit("Expanded archive exceeds 1 GiB safety limit")
                  target = destination.joinpath(*member.parts)
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if target.exists():
                      raise SystemExit(f"Duplicate archive path: {info.filename}")
                  with zf.open(info) as source, target.open("xb") as output:
                      while chunk := source.read(1024 * 1024):
                          output.write(chunk)
                  extracted += 1

          print(f"Extracted files: {extracted}")
          print(f"Expanded bytes: {total_size}")
          print(f"Destination: {destination}")
          PY

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCHIVES/TAKKA_W_NOSS
          if git diff --cached --quiet; then
            echo "No extracted files to commit."
            exit 0
          fi
          git commit -m "Extract Takka W Noss archive"
          git push
