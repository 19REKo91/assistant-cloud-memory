name: Binary Box — All 118 Elements

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install plotting dependency
        run: python -m pip install matplotlib

      - name: Calculate all 118 elements
        run: python PROJECTS/element-mass-doubling/binary_box_all_118.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: binary-box-all-118-results
          path: PROJECTS/element-mass-doubling/outputs/binary_box_mass_position_all_118.*
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated table and chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECTS/element-mass-doubling/outputs/binary_box_mass_position_all_118.*
          if git diff --cached --quiet; then
            echo "No generated output changes."
          else
            git commit -m "Add binary-box mass-position results for all 118 elements"
            git push
          fi
