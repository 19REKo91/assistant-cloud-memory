name: CHRONO CROSS GPT MCP smoke-test utility

on:
  push:
    branches: [main]
    paths:
      - "tools/chrono-cross-gpt-mcp-smoke-test.mjs"
      - "tools/test-chrono-cross-gpt-mcp-smoke-test.mjs"
      - ".github/workflows/chrono-cross-gpt-mcp-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Node.js version
        run: node --version
      - name: Validate smoke-test syntax
        run: node --check tools/chrono-cross-gpt-mcp-smoke-test.mjs
      - name: Run offline mock tests (dummy credentials only)
        run: node tools/test-chrono-cross-gpt-mcp-smoke-test.mjs
