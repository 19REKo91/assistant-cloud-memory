name: CHRONO CROSS GPT MCP smoke-test utility

on:
  push:
    branches: [main, chronocross-offline-prep-2026-10-16]
    paths:
      - ".mcp.json"
      - ".vscode/mcp.json"
      - ".github/agents/chrono-cross-gpt-reader.agent.md"
      - ".github/workflows/chrono-cross-gpt-mcp-production-handshake.yml"
      - "tools/chrono-cross-gpt-mcp-smoke-test.mjs"
      - "tools/test-chrono-cross-gpt-mcp-smoke-test.mjs"
      - "docs/CHRONO_CROSS_URL_SAFETY_TEST_VECTORS.json"
      - "tools/test-chrono-cross-url-safety-vectors.mjs"
      - "docs/CHRONO_CROSS_CAPABILITY_STATUS.json"
      - "tools/test-chrono-cross-capability-registry.mjs"
      - ".github/workflows/chrono-cross-gpt-mcp-smoke-test.yml"
      - ".github/workflows/chrono-cross-gpt-reader-production-smoke.yml"
      - "tools/chrono-cross-gpt-reader-smoke-test.mjs"
      - "chrono-reader-core/read-text-document.mjs"
      - "tools/test-chrono-cross-text-document-reader.mjs"
      - "chrono-reader-core/package.json"
      - "chrono-reader-core/read-office-document.mjs"
      - "tools/test-chrono-cross-office-document-reader.mjs"
      - "chrono-reader-core/read-document.mjs"
      - "tools/test-chrono-cross-document-router.mjs"
      - "chrono-reader-core/server.mjs"
      - "chrono-reader-core/Dockerfile"
      - "tools/test-chrono-cross-reader-bridge-server.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Node.js version
        run: node --version
      - name: Validate MCP configuration JSON and safe allowlists
        run: node -e 'const fs=require("node:fs");const a=require("node:assert/strict");const p=JSON.parse(fs.readFileSync(".mcp.json","utf8")).mcpServers["chrono-cross-gpt"];const v=JSON.parse(fs.readFileSync(".vscode/mcp.json","utf8"));a.equal(p.type,"http");a.equal(p.url,"https://chrono-cross-gpt.floot.app/_api/mcp");a.equal(p.headers.Authorization,"Bearer ${COPILOT_MCP_CHRONO_TOKEN}");a.deepEqual(p.tools,["read_public_page","get_browser_capabilities"]);const input=v.inputs.find(x=>x.id==="chronoMcpToken");a.equal(input.password,true);a.equal(v.servers["chrono-cross-gpt"].headers.Authorization,"Bearer ${input:chronoMcpToken}");console.log("PASS MCP JSON configs and read-only allowlists");'
      - name: Validate Copilot custom-agent YAML frontmatter
        run: |
          ruby -e 'require "yaml"; s=File.read(".github/agents/chrono-cross-gpt-reader.agent.md"); parts=s.split(/^---\s*$/, 3); abort "missing YAML frontmatter" if parts.length < 3; data=YAML.safe_load(parts[1], aliases: false); abort "wrong custom agent target" unless data["target"] == "github-copilot"; abort "missing MCP server" unless data.dig("mcp-servers", "chrono-cross-gpt", "url") == "https://chrono-cross-gpt.floot.app/_api/mcp"; abort "unexpected tool allowlist" unless data["tools"] == ["chrono-cross-gpt/read_public_page", "chrono-cross-gpt/get_browser_capabilities"]; abort "authorization must reference the Agents secret" unless data.dig("mcp-servers", "chrono-cross-gpt", "headers", "Authorization") == ("Bearer " + "$" + "{{ secrets.COPILOT_MCP_CHRONO_TOKEN" + " }}"); puts "PASS Copilot custom-agent frontmatter and allowlist"'
      - name: Validate manual production workflow YAML
        run: |
          ruby -e 'require "yaml"; d=YAML.safe_load_file(".github/workflows/chrono-cross-gpt-mcp-production-handshake.yml", aliases: false); triggers=d["on"] || d[true]; abort "workflow_dispatch trigger missing" unless triggers.is_a?(Hash) && triggers.key?("workflow_dispatch"); push=triggers["push"]; expected_branch=["chronocross-offline-prep-2026-10-16"]; expected_paths=[".github/workflows/chrono-cross-gpt-mcp-production-handshake.yml", "tools/chrono-cross-gpt-mcp-smoke-test.mjs"]; abort "push trigger must be narrowly scoped" unless push && push["branches"] == expected_branch && push["paths"] == expected_paths; abort "unexpected workflow trigger" unless (triggers.keys - ["workflow_dispatch", "push"]).empty?; abort "missing handshake job" unless d.dig("jobs", "handshake", "steps").any? { |s| s["name"] == "Run real production MCP handshake" }; puts "PASS manual and narrowly scoped automatic production workflow YAML"'
      - name: Validate smoke-test syntax
        run: node --check tools/chrono-cross-gpt-mcp-smoke-test.mjs
      - name: Validate reader production workflow YAML
        run: |
          ruby -e 'require "yaml"; d=YAML.safe_load_file(".github/workflows/chrono-cross-gpt-reader-production-smoke.yml", aliases: false); triggers=d["on"] || d[true]; abort "workflow_dispatch trigger missing" unless triggers.is_a?(Hash) && triggers.key?("workflow_dispatch"); push=triggers["push"]; abort "reader workflow push trigger must be narrowly scoped" unless push && push["branches"] == ["chronocross-offline-prep-2026-10-16"] && push["paths"] == [".github/workflows/chrono-cross-gpt-reader-production-smoke.yml", "tools/chrono-cross-gpt-reader-smoke-test.mjs"]; abort "missing reader smoke job" unless d.dig("jobs", "reader-smoke", "steps").any? { |s| s["name"] == "Test public page and synthetic local PDF on production" }; puts "PASS reader production workflow YAML and narrow trigger"'
      - name: Validate reader smoke-test syntax
        run: node --check tools/chrono-cross-gpt-reader-smoke-test.mjs
      - name: Run offline mock tests (dummy credentials only)
        run: node tools/test-chrono-cross-gpt-mcp-smoke-test.mjs
      - name: Validate capability registry and evidence status
        run: node tools/test-chrono-cross-capability-registry.mjs
      - name: Validate text document reader syntax
        run: node --check chrono-reader-core/read-text-document.mjs
      - name: Run text, Markdown, CSV and JSON reader tests (offline only)
        run: node tools/test-chrono-cross-text-document-reader.mjs
      - name: Install pinned document-reader dependencies
        run: npm install --prefix chrono-reader-core --ignore-scripts --no-audit --no-fund
      - name: Validate Office reader syntax
        run: node --check chrono-reader-core/read-office-document.mjs
      - name: Run Office reader tests with synthetic DOCX and XLSX (offline fixtures)
        run: node tools/test-chrono-cross-office-document-reader.mjs
      - name: Validate unified reader router syntax
        run: node --check chrono-reader-core/read-document.mjs
      - name: Run unified reader routing tests (offline fixtures)
        run: node tools/test-chrono-cross-document-router.mjs
      - name: Validate reader bridge server syntax
        run: node --check chrono-reader-core/server.mjs
      - name: Run reader bridge HTTP contract tests on loopback only
        run: node tools/test-chrono-cross-reader-bridge-server.mjs
      - name: Validate URL safety test-vector integrity (offline only)
        run: node tools/test-chrono-cross-url-safety-vectors.mjs
