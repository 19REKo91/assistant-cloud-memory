name: AME2020 Nuclear Binding Energy Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install plotting dependency
        run: python -m pip install matplotlib
      - name: Download and analyze official AME2020 nuclide table
        run: python PROJECTS/element-mass-doubling/ame2020_binding_energy_analysis.py
      - name: Upload AME2020 outputs
        uses: actions/upload-artifact@v4
        with:
          name: ame2020-binding-energy-results
          path: |
            PROJECTS/element-mass-doubling/outputs/ame2020_*
          if-no-files-found: error
          retention-days: 30
      - name: Commit generated analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECTS/element-mass-doubling/outputs/ame2020_*
          if git diff --cached --quiet; then
            echo "No generated output changes."
          else
            git commit -m "Add AME2020 nuclear binding energy analysis"
            git push
          fi
