name: Export image for ChatGPT
on:
  push:
    branches: [main]
jobs:
  package-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-image
          path: deepseek_20260919_c36d4e.png
          if-no-files-found: error
