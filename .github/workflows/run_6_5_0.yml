name: Run Cosmic Triangle 6.5.0
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run 6.5.0 calculation engine
        run: python PROJECTS/triangle-framework/6.5.0/recalc_6.5.0_engine.py
      - name: Upload calculation outputs
        uses: actions/upload-artifact@v4
        with:
          name: triangle-framework-6.5.0-results
          path: |
            PROJECTS/triangle-framework/6.5.0/output/elements_6.5.0_results.csv
            PROJECTS/triangle-framework/6.5.0/output/SUMMARY_6.5.0.txt
